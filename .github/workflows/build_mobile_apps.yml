name: Build EOTO Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build iOS IPA (for iPhone)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter on macOS
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build iOS App (No Codesign) & Package EOTO-iOS.ipa
        working-directory: eoto_app
        run: |
          flutter pub get
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, .*/platform :ios, '15.0'/g" ios/Podfile
            sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/g" ios/Podfile
          fi
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r EOTO-iOS.ipa Payload

      - name: Upload EOTO iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOTO-iOS-IPA
          path: eoto_app/build/ios/iphoneos/EOTO-iOS.ipa

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies & Build Release APK
        working-directory: eoto_app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload EOTO Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOTO-Android-APK
          path: eoto_app/build/app/outputs/flutter-apk/app-release.apk
