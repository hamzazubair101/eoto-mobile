name: Build EOTO iOS IPA (iPhone)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build iOS IPA (for iPhone)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter on macOS
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build iOS App (No Codesign) & Package EOTO-iOS.ipa
        working-directory: eoto_app
        run: |
          flutter pub get
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, .*/platform :ios, '15.0'/g" ios/Podfile
            sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/g" ios/Podfile
          fi
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r EOTO-iOS.ipa Payload

      - name: Upload EOTO iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EOTO-iOS-IPA
          path: eoto_app/build/ios/iphoneos/EOTO-iOS.ipa
